<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a6b"/>
      <stop offset="0.5" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#2f6bf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="plus" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <g fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="3" stroke-linecap="round">
        <path d="M60 44 v32 M44 60 h32"/>
      </g>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#g)"/>
  <rect width="1920" height="1080" fill="url(#plus)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- faint EKG / heartbeat line -->
  <polyline fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="4"
    stroke-linejoin="round" stroke-linecap="round"
    points="0,560 360,560 410,560 450,470 500,690 545,400 590,560 760,560 800,560 840,500 880,610 930,560 1180,560 1230,560 1270,485 1315,660 1360,560 1560,560 1610,560 1650,505 1695,615 1740,560 1920,560"/>
</svg>
